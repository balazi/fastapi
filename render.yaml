services:
  - type: web
    name: census-income-api
    runtime: python
    branch: main
    # Deployment is triggered by the GitHub Actions deploy job (deploy hook)
    # only after flake8 and pytest succeed.
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
